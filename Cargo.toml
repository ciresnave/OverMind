[workspace]
resolver = "2"
members = ["crates/user-request", "crates/with-secret"]

# ⚠️ ONE VERSION NUMBER PER PROJECT (CIRESNAVE-EXPECTATIONS.md §2.2). OverMind's
# Python package and every crate here share pyproject.toml's version - keep
# them in lockstep: tests/test_version_lockstep.py fails CI when they differ.
[workspace.package]
version = "0.11.2"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ciresnave/OverMind"

# `lane-state` lives in its own repo and is taken from crates.io by version
# (CireSnave 2026-10-07: no `../other-repo` paths). It carries its own version
# number, not this workspace's.
[workspace.dependencies]
lane-state = "0.12.15"
